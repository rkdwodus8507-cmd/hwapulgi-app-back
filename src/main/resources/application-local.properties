# H2 in-memory
spring.datasource.url=jdbc:h2:mem:hwapulgi;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Redis (embedded — port 6370)
spring.data.redis.host=localhost
spring.data.redis.port=6370

# JWT (local dev only — 운영은 환경변수 JWT_SECRET로 주입)
jwt.secret=local-dev-secret-do-not-use-in-prod-32bytes-min
