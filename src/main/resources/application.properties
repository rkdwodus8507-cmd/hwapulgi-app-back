spring.application.name=hwapulgi
spring.profiles.active=local

# Apps in Toss (mTLS)
# TODO: prod 환경에서는 인증서 경로를 환경변수로 관리할 것
appintoss.api.base-url=https://apps-in-toss-api.toss.im
appintoss.mtls.cert=classpath:certs/client.crt
appintoss.mtls.key=classpath:certs/client.key

# Apps in Toss - 일일 출석 프로모션
# 콘솔에서 발급한 promotionCode로 교체할 것
appintoss.promotion.daily.code=${APPINTOSS_PROMOTION_CODE:DAILY_ATTENDANCE}
appintoss.promotion.daily.amount=${APPINTOSS_PROMOTION_AMOUNT:100}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

jwt.secret=${JWT_SECRET:dev-only-secret-please-replace-me-32-bytes-min}
jwt.access-token-expiry-seconds=3600
jwt.refresh-token-expiry-seconds=2592000
